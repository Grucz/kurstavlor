# Kurstavlor: sajten publiceras som den är. Vid varje publicering skapas
# bygg/tavlor.json (förteckningen över alla tavlor som byggaren visar).
[build]
  publish = "."
  command = "node verktyg/lista-tavlor.mjs"
  # Lösenordsskydd för allt under /bygg/ (se netlify/edge-functions/skydd.js).
  # Lösenordet sätts som miljövariabeln KURSTAVLOR_LOSENORD i Netlify.
  edge_functions = "netlify/edge-functions"

# Funktionen som hämtar förhandsbilder till byggaren.
[functions]
  directory = "netlify/functions"

# Byggaren ska alltid öppnas med snedstreck på slutet.
[[redirects]]
  from = "/bygg"
  to = "/bygg/"
  status = 301
  force = true

# Funktionernas och verktygens källkod ska inte gå att läsa som vanliga filer.
[[redirects]]
  from = "/netlify/*"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/verktyg/*"
  to = "/"
  status = 404
  force = true

# Håll tavlorna borta från sökmotorer.
# Tillåt byggaren att hämta tidigare tavlor även när den körs lokalt.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Access-Control-Allow-Origin = "*"
