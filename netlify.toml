# Kurstavlor: sajten publiceras som den är. Vid varje publicering skapas
# tavlor.json (förteckningen över alla tavlor som byggaren visar).
[build]
  publish = "."
  command = "node verktyg/lista-tavlor.mjs"

# Funktionen som hämtar förhandsbilder till byggaren.
[functions]
  directory = "netlify/functions"

# Funktionens källkod ska inte gå att läsa som vanlig fil.
[[redirects]]
  from = "/netlify/*"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/verktyg/*"
  to = "/"
  status = 404
  force = true

# Håll tavlorna borta från sökmotorer.
# Tillåt byggaren att hämta tidigare tavlor även när den körs lokalt.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Access-Control-Allow-Origin = "*"
